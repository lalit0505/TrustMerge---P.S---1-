[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmerge"
version = "0.1.0"
description = "Git conflict resolution with testing provenance: where each side came from and whether it was tested"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trustmerge = "trustmerge.cli:app"
git-trustmerge = "trustmerge.cli:app"
git-prov = "trustmerge.cli:app"

[tool.setuptools.packages.find]
include = ["trustmerge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
